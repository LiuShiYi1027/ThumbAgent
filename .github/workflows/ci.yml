name: CI

on:
  push:
    branches: [main]
  pull_request:

concurrency:
  group: ci-${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  runtime:
    name: Runtime (Python 3.11)
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: "3.11"

      # The Python gate is dependency-free: scripts/quality.py (stdlib AST checks),
      # unittest discovery, and the TypeScript contract generator check.
      - name: Lint / typecheck / tests / contract check
        run: make check PYTHON=python3

  desktop:
    name: Desktop (npm + cargo)
    runs-on: macos-latest
    timeout-minutes: 40
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: 20
          cache: npm
          cache-dependency-path: apps/desktop/package-lock.json

      - uses: dtolnay/rust-toolchain@stable
        with:
          components: clippy, rustfmt

      - uses: Swatinem/rust-cache@v2
        with:
          workspaces: apps/desktop/src-tauri

      - name: Install frontend dependencies
        working-directory: apps/desktop
        run: npm ci

      # tauri-build validates the configured frontendDist (../dist) during
      # cargo compilation; produce it on fresh CI checkouts first.
      - name: Build frontend bundle
        working-directory: apps/desktop
        run: npm run build

      - name: Desktop gate (oxlint, tsc, cargo fmt/clippy/test)
        run: make check-desktop
