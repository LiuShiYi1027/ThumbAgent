name: Release

on:
  push:
    tags: ["v*"]

concurrency:
  group: release-${{ github.ref }}
  cancel-in-progress: false

permissions:
  contents: write

jobs:
  macos:
    name: Build / Sign / Notarize / Publish (macOS)
    runs-on: macos-14
    timeout-minutes: 60
    env:
      APPLE_CERTIFICATE: ${{ secrets.APPLE_CERTIFICATE }}
      APPLE_CERTIFICATE_PASSWORD: ${{ secrets.APPLE_CERTIFICATE_PASSWORD }}
      APPLE_API_KEY: ${{ secrets.APPLE_API_KEY }}
      APPLE_API_KEY_ID: ${{ secrets.APPLE_API_KEY_ID }}
      APPLE_API_ISSUER: ${{ secrets.APPLE_API_ISSUER }}
      APPLE_ID: ${{ secrets.APPLE_ID }}
      APPLE_APP_PASSWORD: ${{ secrets.APPLE_APP_PASSWORD }}
      APPLE_TEAM_ID: ${{ secrets.APPLE_TEAM_ID }}
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: 20
          cache: npm
          cache-dependency-path: apps/desktop/package-lock.json

      - uses: dtolnay/rust-toolchain@stable

      - uses: Swatinem/rust-cache@v2
        with:
          workspaces: apps/desktop/src-tauri

      # Import the Developer ID certificate (base64-encoded .p12) into an
      # ephemeral keychain that only exists for the duration of this job.
      - name: Import signing certificate
        run: |
          set -euo pipefail
          CERT_PATH="$RUNNER_TEMP/developer-id.p12"
          KEYCHAIN_PATH="$RUNNER_TEMP/signing.keychain-db"
          KEYCHAIN_PASSWORD="$(openssl rand -base64 32)"

          printf '%s' "$APPLE_CERTIFICATE" | base64 --decode > "$CERT_PATH"

          security create-keychain -p "$KEYCHAIN_PASSWORD" "$KEYCHAIN_PATH"
          security set-keychain-settings -lut 3600 "$KEYCHAIN_PATH"
          security unlock-keychain -p "$KEYCHAIN_PASSWORD" "$KEYCHAIN_PATH"
          security import "$CERT_PATH" -k "$KEYCHAIN_PATH" \
            -P "$APPLE_CERTIFICATE_PASSWORD" -T /usr/bin/codesign -T /usr/bin/security
          security set-key-partition-list -S apple-tool:,apple:,codesign: \
            -s -k "$KEYCHAIN_PASSWORD" "$KEYCHAIN_PATH"
          security list-keychain -d user -s "$KEYCHAIN_PATH" $(security list-keychain -d user | tr -d '"')
          rm -f "$CERT_PATH"

          # Fail fast if the expected identity is not visible.
          security find-identity -v -p codesigning "$KEYCHAIN_PATH" | \
            grep "Developer ID Application: guoqing liu (JRDVQ57V39)"

      - name: Install frontend dependencies
        working-directory: apps/desktop
        run: npm ci

      # tauri.conf.json pins signingIdentity + hardenedRuntime + entitlements.
      - name: Build and sign bundle
        working-directory: apps/desktop
        run: npm run tauri build

      - name: Verify signature
        run: |
          set -euo pipefail
          APP="apps/desktop/src-tauri/target/release/bundle/macos/ThumbAgent.app"
          codesign -vvv --deep --strict "$APP"
          codesign -dv --verbose=4 "$APP" 2>&1 | grep "TeamIdentifier=JRDVQ57V39"
          codesign -dv --verbose=4 "$APP" 2>&1 | grep "flags=0x10000(runtime)"
          DMG=$(ls apps/desktop/src-tauri/target/release/bundle/dmg/*.dmg)
          codesign -vvv --deep --strict "$DMG"

      - name: Prepare notarization credentials
        run: |
          set -euo pipefail
          if [ -n "$APPLE_API_KEY" ]; then
            printf '%s' "$APPLE_API_KEY" | base64 --decode > "$RUNNER_TEMP/AuthKey.p8"
            echo "NOTARY_MODE=api-key" >> "$GITHUB_ENV"
          elif [ -n "$APPLE_APP_PASSWORD" ]; then
            echo "NOTARY_MODE=apple-id" >> "$GITHUB_ENV"
          else
            echo "NOTARY_MODE=none" >> "$GITHUB_ENV"
          fi

      - name: Notarize (App Store Connect API key)
        if: env.NOTARY_MODE == 'api-key'
        run: |
          set -euo pipefail
          DMG=$(ls apps/desktop/src-tauri/target/release/bundle/dmg/*.dmg)
          xcrun notarytool submit "$DMG" \
            --key "$RUNNER_TEMP/AuthKey.p8" \
            --key-id "$APPLE_API_KEY_ID" \
            --issuer "$APPLE_API_ISSUER" \
            --wait
          xcrun stapler staple "$DMG"

      - name: Notarize (Apple ID + app-specific password)
        if: env.NOTARY_MODE == 'apple-id'
        run: |
          set -euo pipefail
          DMG=$(ls apps/desktop/src-tauri/target/release/bundle/dmg/*.dmg)
          xcrun notarytool submit "$DMG" \
            --apple-id "$APPLE_ID" \
            --password "$APPLE_APP_PASSWORD" \
            --team-id "$APPLE_TEAM_ID" \
            --wait
          xcrun stapler staple "$DMG"

      - name: Skip notarization
        if: env.NOTARY_MODE == 'none'
        run: |
          echo "::warning::No notarization credentials configured; publishing signed-but-unnotarized build."

      - name: Verify Gatekeeper assessment
        if: env.NOTARY_MODE != 'none'
        run: |
          set -euo pipefail
          DMG=$(ls apps/desktop/src-tauri/target/release/bundle/dmg/*.dmg)
          spctl -a -vv --type install "$DMG"

      - name: Publish GitHub Release
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          set -euo pipefail
          DMG=$(ls apps/desktop/src-tauri/target/release/bundle/dmg/*.dmg)
          gh release create "${GITHUB_REF_NAME}" "$DMG" \
            --title "ThumbAgent ${GITHUB_REF_NAME}" \
            --generate-notes \
            || gh release upload "${GITHUB_REF_NAME}" "$DMG" --clobber
