[project]
name = "thumbagent-runtime"
version = "0.1.0"
description = "ThumbAgent: local-first mobile device skills runtime"
requires-python = ">=3.11"
license = { text = "Apache-2.0" }

[project.urls]
Repository = "https://github.com/LiuShiYi1027/ThumbAgent"

[tool.ruff]
target-version = "py311"
line-length = 100
src = ["runtime"]

[tool.pyright]
pythonVersion = "3.11"
typeCheckingMode = "strict"
include = ["runtime/mobile_agent", "runtime/tests"]

